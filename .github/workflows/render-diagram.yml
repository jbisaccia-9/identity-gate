name: Render live flow diagram
on:
  push:
    paths: ['telemetry/state_snapshot.json']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/render_diagram.js
      - run: |
          git config user.name "flow-renderer[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "render: live flow diagram [skip ci]" && git push)
